name: Deploy

# Static build → GitHub Pages.
# Spec: docs/architecture.md §6.

on:
  push:
    branches: [main]
  # Daily redeploy so the site picks up the refresh.yml data commit. A push
  # made with GITHUB_TOKEN does not trigger this workflow's `push` event, so
  # we rebuild on a schedule shortly after Daily Refresh (04:00 UTC) instead.
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily, ~1h after refresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
