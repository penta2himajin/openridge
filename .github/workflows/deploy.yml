name: Deploy

# Static build → GitHub Pages, published to the `gh-pages` branch root.
#
# We publish to a branch (not the deploy-pages artifact) so that PR previews
# can live alongside production under gh-pages/pr-preview/ (see preview.yml).
# A repo serves Pages from a single source, so both production and previews
# share the gh-pages branch. Spec: docs/architecture.md §6.
#
# Repo setting required once: Settings → Pages → Source = "Deploy from a
# branch" → gh-pages / (root).

on:
  push:
    branches: [main]
  # Daily redeploy so the site picks up the refresh.yml data commit even if
  # that commit's push did not trigger this workflow.
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily, ~1h after refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (root base for the openridge.dev apex domain)
        run: npm run build
        env:
          # Served at the apex custom domain root, so assets live at /_assets,
          # not /openridge/_assets. astro.config.mjs reads these.
          SITE_BASE: /
          SITE_URL: https://openridge.dev

      # Publish dist to the gh-pages branch root. `clean` removes stale files
      # but `clean-exclude` preserves the pr-preview/ umbrella so a production
      # deploy never wipes an in-flight PR preview. CNAME ships inside dist
      # (copied from public/), so the custom domain survives each deploy.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            pr-preview/
