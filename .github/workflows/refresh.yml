name: Daily Refresh

# Fetch AA + HF, regenerate data/models.json, commit if changed.
# Spec: docs/architecture.md §5.

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Falls back to GITHUB_TOKEN when REFRESH_PAT is unset. Supply a PAT
          # (with `contents: write`) as REFRESH_PAT if `main`'s ruleset can't
          # grant the github-actions bot a direct-push bypass.
          token: ${{ secrets.REFRESH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build data
        run: npm run refresh
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add data/models.json data/gguf_sizes.json data/hf_aliases.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh $(date -u +%Y-%m-%d)"
            git push
          fi
